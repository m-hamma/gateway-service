server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/orders/**

app:
  jwt:
    secret: MyVerySecretKeyForJwtGeneration123456789123456789

logging:
  level:
    org.springframework.cloud.gateway: TRACE